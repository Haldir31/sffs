---
# Pretask SSDV2 de sffs : secrets, rôle Postgres en lecture seule dans stremio-postgres,
# configuration StreamFusion et image Docker.

# --- Prérequis : rien n'est créé si StreamFusion ou silosffs manque -------------------------

- name: StreamFusion est-il installé par SSDV2 ?
  ansible.builtin.command: sqlite3 "{{ settings.source }}/ssddb" "select status from applications where name='streamfusion'"
  register: sffs_reg_sf
  changed_when: false
  check_mode: false
  failed_when: false

- name: Refuser l'installation sans StreamFusion
  ansible.builtin.fail:
    msg: "StreamFusion n'est pas installé par SSDV2 (ou sqlite3 manque) : l'installer d'abord."
  when: sffs_reg_sf.rc != 0 or sffs_reg_sf.stdout | trim != '2'

- name: silosffs est-il installé par SSDV2 ?
  ansible.builtin.command: sqlite3 "{{ settings.source }}/ssddb" "select status from applications where name='silosffs'"
  register: sffs_reg_silo
  changed_when: false
  check_mode: false
  failed_when: false

- name: silosffs est-il démarré ?
  ansible.builtin.command: docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' silosffs
  register: sffs_silo_running
  changed_when: false
  check_mode: false
  failed_when: false

# sffs ne sert qu'à silosffs : seul lecteur capable d'« armer » un fichier avant de le lire.
- name: Refuser l'installation sans silosffs
  ansible.builtin.fail:
    msg: "silosffs (Silo pour sffs) n'est pas installé ou est arrêté : l'installer d'abord (ssd/install.sh --only silo)."
  when: sffs_reg_silo.stdout | default('') | trim != '2' or sffs_silo_running.stdout | default('') | trim != 'true'

- name: Dossier des secrets sffs
  ansible.builtin.set_fact:
    sffs_secret_dir: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/sffs-secrets"

- name: Créer les dossiers sffs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ sffs_secret_dir }}", mode: "0700" }
    - { path: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/sffs/config", mode: "0755" }

- name: Créer le point de montage /mnt/sffs
  become: true
  ansible.builtin.file:
    path: /mnt/sffs
    state: directory
    mode: "0755"

- name: Vérifier que StreamFusion (SSDV2) est installé
  ansible.builtin.command: docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' stremio-postgres {{ sffs_sf_container }}
  register: sffs_sf_running
  changed_when: false
  failed_when: sffs_sf_running.rc != 0 or 'false' in sffs_sf_running.stdout

# --- Secrets déjà connus (réinstallation) ------------------------------------------------

- name: Lire les secrets existants
  ansible.builtin.slurp:
    src: "{{ sffs_secret_dir }}/{{ item }}"
  loop: [SF_STREAM_CFG, SF_PLAYBACK_CFG, SFFS_TMDB_KEY, SFFS_DB_PASS, SFFS_SILO_KEY]
  register: sffs_existing
  failed_when: false
  no_log: true

- name: Mémoriser les secrets existants
  ansible.builtin.set_fact:
    sffs_known: "{{ sffs_known | default({}) | combine({item.item: (item.content | b64decode | trim)}) }}"
  loop: "{{ sffs_existing.results }}"
  when: item.content is defined
  no_log: true

# --- Configuration StreamFusion (URL du manifest de l'addon) ----------------------------

# Sans URL de manifest (sffs_manifest_url / --manifest), la configuration est générée :
# clé d'API StreamFusion dédiée "sffs", clé AllDebrid reprise de decypharr (ou demandée).

# AllDebrid refuse (503) les téléchargements depuis une adresse de datacenter : sffs lit les
# fichiers par le même proxy que StreamFusion (en général socks5://warp:1080).
- name: Proxy de StreamFusion (PROXY_URL)
  ansible.builtin.shell: >-
    docker inspect -f '{% raw %}{{range .Config.Env}}{{println .}}{{end}}{% endraw %}' {{ sffs_sf_container }}
    | sed -n 's/^PROXY_URL=//p'
  register: sffs_sf_proxy
  changed_when: false

- name: Proxy des téléchargements de sffs
  ansible.builtin.set_fact:
    sffs_debrid_proxy: "{{ sffs_debrid_proxy_override | default(sffs_sf_proxy.stdout | trim) }}"

- name: Adresse locale de StreamFusion (réseau traefik_proxy)
  ansible.builtin.command: docker inspect -f '{% raw %}{{(index .NetworkSettings.Networks "traefik_proxy").IPAddress}}{% endraw %}' {{ sffs_sf_container }}
  register: sffs_sf_ip
  changed_when: false
  when: sffs_known.SF_STREAM_CFG is not defined

- name: Adresse publique de StreamFusion (labels Traefik)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      docker inspect -f '{% raw %}{{range $k, $v := .Config.Labels}}{{$k}}={{$v}}{{println}}{{end}}{% endraw %}' {{ sffs_sf_container }} \
        | grep -E '^traefik\.http\.routers\.[^.]+\.rule=' | grep -v -i admin | grep -o 'Host(`[^`]*`)' | head -1 | sed 's/Host(`\(.*\)`)/https:\/\/\1/'
    executable: /bin/bash
  register: sffs_sf_public
  changed_when: false
  failed_when: false
  when: sffs_known.SF_STREAM_CFG is not defined

- name: Créer (ou retrouver) la clé d'API StreamFusion de sffs
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      P="docker exec stremio-postgres psql -U streamfusion -d streamfusion -qAtc"
      $P "insert into api_keys(api_key,is_active,never_expire,total_queries,name,proxied_links)
          select gen_random_uuid(),true,true,0,'sffs',false
          where not exists (select 1 from api_keys where name='sffs')"
      $P "select api_key from api_keys where name='sffs'"
    executable: /bin/bash
  register: sffs_sf_api_key
  changed_when: false
  when: sffs_known.SF_STREAM_CFG is not defined and (sffs_manifest_url | default('')) == ''
  no_log: true

- name: Clé AllDebrid de decypharr
  ansible.builtin.shell:
    cmd: |
      python3 -c 'import json,sys; c=json.load(open(sys.argv[1])); print(next(d["api_key"] for d in c.get("debrids",[]) if d.get("name")=="alldebrid" and d.get("api_key")))' \
        "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/decypharr/config/config.json"
    executable: /bin/bash
  register: sffs_ad_decypharr
  changed_when: false
  failed_when: false
  when: sffs_known.SF_STREAM_CFG is not defined and (sffs_manifest_url | default('')) == '' and (sffs_alldebrid_key | default('')) == ''
  no_log: true

- name: Demander la clé AllDebrid
  ansible.builtin.pause:
    prompt: |
      SSDV2_PROMPT {"id": "sffs.alldebrid_key", "label": "Clé API AllDebrid", "kind": "secret", "secret": true}
      Entre ta clé API AllDebrid (https://alldebrid.com/apikeys)
    echo: false
  register: sffs_ad_prompt
  when:
    - sffs_known.SF_STREAM_CFG is not defined
    - (sffs_manifest_url | default('')) == ''
    - (sffs_alldebrid_key | default('')) == ''
    - (sffs_ad_decypharr.stdout | default('')) == ''
  no_log: true

- name: Générer la configuration StreamFusion
  ansible.builtin.command:
    argv: ["{{ sffs_repo }}/deploy/bin/sf-make-config.sh"]
  environment:
    SF_URL: "http://{{ sffs_sf_ip.stdout }}:8080"
    SF_PUBLIC: "{{ sffs_sf_public.stdout | default('', true) | trim or ('http://' ~ sffs_sf_ip.stdout ~ ':8080') }}"
    SF_API_KEY: "{{ sffs_sf_api_key.stdout | trim }}"
    AD_TOKEN: "{{ (sffs_alldebrid_key | default('', true)) or (sffs_ad_decypharr.stdout | default('', true)) or (sffs_ad_prompt.user_input | default('')) | trim }}"
    SF_LANGS: "{{ sffs_sf_langs | default('fr,multi') }}"
  register: sffs_cfg_gen
  changed_when: false
  when: sffs_known.SF_STREAM_CFG is not defined and (sffs_manifest_url | default('')) == ''
  no_log: true

- name: Déduire SF_STREAM_CFG et SF_PLAYBACK_CFG d'une URL de manifest fournie
  ansible.builtin.command:
    argv:
      - "{{ sffs_repo }}/deploy/bin/sf-config.sh"
      - "{{ sffs_manifest_url | default('') | trim }}"
      - "tt0172495"
      - "http://{{ sffs_sf_ip.stdout }}:8080"
  register: sffs_cfg_url
  changed_when: false
  when: sffs_known.SF_STREAM_CFG is not defined and (sffs_manifest_url | default('')) != ''
  no_log: true

- name: Sortie du générateur
  ansible.builtin.set_fact:
    sffs_cfg_out: "{{ sffs_cfg_url if (sffs_manifest_url | default('')) != '' else sffs_cfg_gen }}"
  when: sffs_known.SF_STREAM_CFG is not defined
  no_log: true

- name: Retenir la configuration StreamFusion
  ansible.builtin.set_fact:
    sffs_known: >-
      {{ sffs_known | default({}) | combine({
           'SF_STREAM_CFG': (sffs_cfg_out.stdout | regex_search('SF_STREAM_CFG=(\S+)', '\1') | first),
           'SF_PLAYBACK_CFG': (sffs_cfg_out.stdout | regex_search('SF_PLAYBACK_CFG=(\S+)', '\1') | first)
         }) }}
  when: sffs_known.SF_STREAM_CFG is not defined
  no_log: true

# --- Clé TMDB (séries) -------------------------------------------------------------------

- name: Demander la clé TMDB
  ansible.builtin.pause:
    prompt: |
      SSDV2_PROMPT {"id": "sffs.tmdb_key", "label": "Clé TMDB", "kind": "secret", "secret": true}
      Entre ta clé API TMDB (v3), utilisée pour la liste des épisodes des séries
    echo: false
  register: sffs_tmdb_prompt
  when: sffs_known.SFFS_TMDB_KEY is not defined and (streamfusion_tmdb_api_key | default('')) == ''
  no_log: true

- name: Retenir la clé TMDB
  ansible.builtin.set_fact:
    sffs_known: "{{ sffs_known | combine({'SFFS_TMDB_KEY': (streamfusion_tmdb_api_key | default(sffs_tmdb_prompt.user_input | default(''), true) | trim)}) }}"
  when: sffs_known.SFFS_TMDB_KEY is not defined
  no_log: true

- name: Générer le mot de passe du rôle Postgres en lecture seule
  ansible.builtin.set_fact:
    sffs_known: "{{ sffs_known | combine({'SFFS_DB_PASS': lookup('community.general.random_string', length=48, special=false)}) }}"
  when: sffs_known.SFFS_DB_PASS is not defined
  no_log: true

- name: Valider les secrets
  ansible.builtin.assert:
    that:
      - sffs_known.SF_STREAM_CFG | length > 20
      - sffs_known.SF_PLAYBACK_CFG | length > 20
      - sffs_known.SFFS_TMDB_KEY | length > 0
    fail_msg: "Configuration StreamFusion ou clé TMDB invalide (vérifier l'URL du manifest : un film de test doit avoir des sources)."
  no_log: true

- name: Enregistrer les secrets
  ansible.builtin.copy:
    content: "{{ sffs_known[item] }}\n"
    dest: "{{ sffs_secret_dir }}/{{ item }}"
    mode: "0600"
  loop: [SF_STREAM_CFG, SF_PLAYBACK_CFG, SFFS_TMDB_KEY, SFFS_DB_PASS]
  no_log: true

- name: Exposer les secrets au déploiement
  ansible.builtin.set_fact:
    SF_STREAM_CFG: "{{ sffs_known.SF_STREAM_CFG }}"
    SF_PLAYBACK_CFG: "{{ sffs_known.SF_PLAYBACK_CFG }}"
    SFFS_TMDB_KEY: "{{ sffs_known.SFFS_TMDB_KEY }}"
    SFFS_DB_PASS: "{{ sffs_known.SFFS_DB_PASS }}"
    SFFS_SILO_KEY: "{{ sffs_known.SFFS_SILO_KEY | default('') }}"
  no_log: true

# --- Rôle Postgres en lecture seule dans la base StreamFusion -----------------------------

- name: Créer ou mettre à jour le rôle sffs_reader (SELECT sur torrent_items uniquement)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      docker exec -i stremio-postgres psql --no-psqlrc -v ON_ERROR_STOP=1 \
        -v pass="$SFFS_DB_PASS" --username=streamfusion --dbname=streamfusion <<'SQL'
      SELECT format('CREATE ROLE sffs_reader LOGIN PASSWORD %L', :'pass')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sffs_reader') \gexec
      SELECT format('ALTER ROLE sffs_reader WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD %L', :'pass') \gexec
      ALTER ROLE sffs_reader SET default_transaction_read_only = on;
      GRANT CONNECT ON DATABASE streamfusion TO sffs_reader;
      GRANT USAGE ON SCHEMA public TO sffs_reader;
      GRANT SELECT ON public.torrent_items TO sffs_reader;
      SQL
    executable: /bin/bash
  environment:
    SFFS_DB_PASS: "{{ SFFS_DB_PASS }}"
  changed_when: false
  no_log: true

# --- Image -------------------------------------------------------------------------------

- name: L'image sffs existe-t-elle ?
  ansible.builtin.command: docker image inspect localhost/sffs:latest
  register: sffs_image
  changed_when: false
  failed_when: false

- name: Construire l'image sffs (1 à 2 min)
  ansible.builtin.command:
    argv: ["{{ sffs_repo }}/build-images.sh", "sffs"]
  environment:
    CONTAINER_ENGINE: docker
    SFFS_IMAGE: localhost/sffs:latest
  when: sffs_image.rc != 0 or (sffs_rebuild | default(false) | bool)
