---
# Posttask SSDV2 de silosffs : DNS de l'API Jellyfin, attente du démarrage, étapes suivantes.

- name: "Enregistrement DNS de l'API compatible Jellyfin"
  ansible.builtin.include_tasks: "{{ settings.source }}/includes/config/roles/cloudflare/tasks/main.yml"
  vars:
    subdomain: "{{ (sub[pgrole][pgrole] if sub_enabled else pgrole) }}-jf"
  when: cloudflare_enabled

- name: "Rappel DNS (sans Cloudflare)"
  ansible.builtin.debug:
    msg: "Créer un enregistrement A {{ (sub[pgrole][pgrole] if sub_enabled else pgrole) }}-jf.{{ user.domain }} -> {{ network.ipv4 }} pour les applications Jellyfin."
  when: not cloudflare_enabled

- name: Attendre que Silo réponde (migrations de la base au premier démarrage)
  ansible.builtin.command: docker exec "{{ pgrole }}" curl -sf http://localhost:8080/api/v1/health
  register: silo_health
  until: silo_health.rc == 0
  retries: 120
  delay: 10
  changed_when: false

- name: Étapes suivantes
  ansible.builtin.debug:
    msg:
      - "Silo est prêt : https://{{ sub[pgrole][pgrole] if sub_enabled else pgrole }}.{{ user.domain }}"
      - "1. Crée le compte admin dans l'interface web."
      - "2. Une fois sffs installé, ajoute les bibliothèques : Films -> /mnt/sf/films, Séries -> /mnt/sf/series"
      - "3. Lance <dépôt sffs>/ssd/silo-key.sh : clé d'API pour les scans ciblés de sffs."
