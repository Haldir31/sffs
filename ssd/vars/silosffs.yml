---
# Silo modifié pour lire les fichiers sffs (application SSDV2 "silosffs").
# Interface web : https://<sous-domaine>.<domaine>
# API compatible Jellyfin (Apple TV, Infuse, Swiftfin…) : https://<sous-domaine>-jf.<domaine>
pgrole: 'silosffs'
intport: '8080'
image: 'localhost/silo-sffs:latest'
pull_image: false

# Dépôt sffs (renseigné par ssd/install.sh) : sert à construire l'image si elle manque.
sffs_repo: '__SFFS_REPO__'
silo_gomaxprocs: '8'

pg_volumes:
  - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}/plugins:/var/lib/silo/plugins"
  - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}/artwork:/var/lib/silo/artwork"
  - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}/compat:/var/lib/silo/compat"
  - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}/transcode:/tmp/silo-transcode"
  - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}/download-artifacts:/tmp/silo-download-artifacts"
  # Bibliothèque virtuelle sffs. rslave : un redémarrage de sffs est vu sans redémarrer Silo.
  - '/mnt/sffs:/mnt/sf:ro,rslave'
  - '/etc/localtime:/etc/localtime:ro'

pg_env:
  MODE: 'integrated'
  PORT: '8080'
  JF_PORT: '8096'
  ABS_PORT: '13378'
  SECRET_KEY: "{{ SILO_SECRET_KEY }}"
  DATABASE_URL: "postgres://silo:{{ SILO_DB_PASS }}@db-{{ pgrole }}:5432/silo?sslmode=disable"
  REDIS_URL: "redis://redis-{{ pgrole }}:6379"
  SILO_PLUGIN_CACHE_DIR: '/var/lib/silo/plugins'
  SILO_SF_ROOT: '/mnt/sf'
  SILO_POC_REMOTE: '1'
  SILO_SHUTDOWN_DELAY: '0'
  GOMAXPROCS: "{{ silo_gomaxprocs }}"
  TZ: 'Europe/Paris'

# Seconde route Traefik pour l'API compatible Jellyfin (port 8096 du conteneur), sans
# authentification Traefik : les applications Jellyfin ne savent pas la passer, Silo authentifie.
extra_labels:
  traefik.http.routers.silosffs-jf-rtr.entrypoints: 'http,https'
  traefik.http.routers.silosffs-jf-rtr.rule: "Host(`{{ sub[pgrole][pgrole] if sub_enabled else pgrole }}-jf.{{ user.domain }}`)"
  traefik.http.routers.silosffs-jf-rtr.tls: 'true'
  traefik.http.routers.silosffs-jf-rtr.tls.certresolver: 'letsencrypt'
  traefik.http.routers.silosffs-jf-rtr.middlewares: 'chain-no-auth@file'
  traefik.http.routers.silosffs-jf-rtr.service: 'silosffs-jf-svc'
  traefik.http.services.silosffs-jf-svc.loadbalancer.server.port: '8096'

specific_docker_info:
  restart_policy: unless-stopped
  stop_timeout: 120
