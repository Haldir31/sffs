---
# sffs pour SSDV2 : StreamFusion exposé comme bibliothèque de fichiers virtuels (FUSE) sur
# l'hôte, dans /mnt/sffs, lue par Silo (application silosffs).
# Installé par ssd/install.sh (copié dans <SETTINGS_STORAGE>/vars/, chemin du dépôt renseigné).
pgrole: 'sffs'
image: 'localhost/sffs:latest'
pull_image: false
traefik_labels_enabled: false

# Dépôt sffs (renseigné par ssd/install.sh) : sert à construire l'image si elle manque.
sffs_repo: '__SFFS_REPO__'
# Réglages (facultatifs) : voir docs/ARCHITECTURE.md.
sffs_langs: 'fr'
sffs_per_quality: '5'
sffs_series: '1'
sffs_series_per_quality: '2'

pg_volumes:
  # Le montage FUSE créé dans le conteneur remonte vers l'hôte (propagation rshared),
  # comme pour decypharr.
  - '/mnt/sffs:/mnt/sffs:rshared'
  - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/sffs/config:/config:rw"
  - '/etc/localtime:/etc/localtime:ro'

pg_env:
  # Base StreamFusion (conteneur stremio-postgres de SSDV2), rôle en lecture seule créé par la pretask.
  SF_PG_DSN: "postgres://sffs_reader:{{ SFFS_DB_PASS }}@stremio-postgres:5432/streamfusion?sslmode=disable&options=-c%20default_transaction_read_only%3Don"
  SF_BASE: 'http://stream-fusion:8080'
  SF_STREAM_CFG: "{{ SF_STREAM_CFG }}"
  SF_PLAYBACK_CFG: "{{ SF_PLAYBACK_CFG }}"
  SFFS_MOUNT: '/mnt/sffs'
  SFFS_ALLOW_OTHER: '1'
  SFFS_ALLOW_COMM: '^(silo|ffmpeg|ffprobe)$'
  SFFS_LANGS: "{{ sffs_langs }}"
  SFFS_REQUIRE_PREFERRED_HD: '1'
  SFFS_PER_QUALITY: "{{ sffs_per_quality }}"
  SFFS_SERIES: "{{ sffs_series }}"
  SFFS_SERIES_PER_QUALITY: "{{ sffs_series_per_quality }}"
  SFFS_TMDB_KEY: "{{ SFFS_TMDB_KEY }}"
  SFFS_WATCH: '1m'
  SFFS_RELOAD: '24h'
  # Scans ciblés de Silo (clé créée après le premier démarrage de Silo : ssd/silo-key.sh).
  SFFS_SILO_URL: 'http://silosffs:8080'
  SFFS_SILO_KEY: "{{ SFFS_SILO_KEY }}"
  SFFS_SILO_FILMS: '/mnt/sf/films'
  SFFS_SILO_SERIES: '/mnt/sf/series'
  GOMAXPROCS: '4'
  TZ: 'Europe/Paris'

specific_docker_info:
  devices:
    - '/dev/fuse:/dev/fuse:rwm'
  capabilities:
    - SYS_ADMIN
  security_opts:
    - 'apparmor:unconfined'
  # Voir les processus de l'hôte : sffs vérifie quel programme lit un fichier (SFFS_ALLOW_COMM).
  pid_mode: 'host'
  restart_policy: 'always'
  stop_timeout: 30
